name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build
        shell: pwsh
        run: |
          $ver = "1.1.0"
          if ("${{ github.ref_type }}" -eq "tag") { $ver = "${{ github.ref_name }}".TrimStart("v") }
          ./scripts/build.ps1 -Version $ver

      - uses: actions/upload-artifact@v4
        with:
          name: JDM-Setup
          path: installer/Output/*.exe

      # The installer is published to a separate PUBLIC repository, so this source repository can stay private.
      # Needs a secret named RELEASES_TOKEN (fine-grained token, "Contents: Read and write" on MFD-Download only).
      - name: Publish release to the public download repository
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          repository: AliAlsaffarMosulUniversity/MFD-Download
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          files: installer/Output/*.exe
